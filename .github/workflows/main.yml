name: 学习通自动刷课

on:
  push:
    branches: [main]
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SuperStar-main

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成配置文件
        run: |
          cat > config.ini << 'CONFEOF'
          [DEFAULT]
          name = 网课答题工具

          [tiku]
          provider=Doubao
          submit=true
          cover_rate = 0.8
          true_list=正确,对,√,是
          false_list=错误,错,×,否,不对,不正确

          deepseek_endpoint = https://api.deepseek.com/v1/chat/completions
          deepseek_api_key = ${{ secrets.DEEPSEEK_API_KEY }}
          deepseek_model = deepseek-chat
          deepseek_min_interval = 1
          CONFEOF

      - name: 运行刷课
        run: python main.py -u "15874903013" -p "15874903013" -l "264391804" -a retry
