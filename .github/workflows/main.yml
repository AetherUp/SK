name: 学习通自动刷课

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      username:
        description: "学习通手机号"
        required: true
      password:
        description: "学习通密码"
        required: true
      course_list:
        description: "课程ID（多个用逗号分隔）"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SuperStar-main

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成配置文件
        run: |
          cat > config.ini << 'CONFEOF'
          [DEFAULT]
          name = 网课答题工具

          [tiku]
          provider=Doubao
          submit=true
          cover_rate = 0.8
          true_list=正确,对,√,是
          false_list=错误,错,×,否,不对,不正确

          doubao_endpoint = https://api.deepseek.com/v1/chat/completions
          doubao_api_key = ${{ secrets.DEEPSEEK_API_KEY }}
          doubao_model = deepseek-chat
          doubao_min_interval = 1
          CONFEOF

      - name: 运行刷课
        if: ${{ github.event.inputs.username || secrets.CHAOXING_USERNAME || github.event_name == 'workflow_dispatch' }}
        run: python main.py -u "${{ github.event.inputs.username || secrets.CHAOXING_USERNAME }}" -p "${{ github.event.inputs.password || secrets.CHAOXING_PASSWORD }}" -l "${{ github.event.inputs.course_list || secrets.COURSE_LIST }}" -a continue
